[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-orchestrator"
version = "0.1.0"
description = "多 Agent 复杂任务编排系统：Main Agent 规划 + 异构 SubAgent 分配"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=1.0",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "fastapi>=0.110",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
codex = [
    "openai-codex>=0.144",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实启动 A2A 服务的测试",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
